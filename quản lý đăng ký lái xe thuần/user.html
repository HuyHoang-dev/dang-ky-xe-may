<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công dân - Nộp hồ sơ đăng ký xe máy</title>
  <link rel="icon" href="seal.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="brand"><img src="seal.jpg" alt="Huy hiệu CSGT"><div><small>Cục Cảnh sát giao thông</small><strong>Cổng đăng ký xe máy trực tuyến</strong></div></div>
    <div class="user-action">
      <span id="welcomeUser"></span>
      <button class="btn btn-outline" onclick="logout()">Đăng xuất</button>
    </div>
  </header>

  <main class="container">
    <div class="grid-2col">
      <section class="card">
        <h3>Thông tin nhân thân</h3>
        <p><strong>Số CMND:</strong> <span id="viewCmnd"></span></p>
        <p><strong>Họ và tên:</strong> <span id="viewHoten"></span></p>
        <p><strong>Ngày sinh:</strong> <span id="viewNgaysinh"></span></p>
        <p><strong>Quê quán:</strong> <span id="viewQuequan"></span></p>
        <div>
          <img id="avatarImg" src="" alt="Ảnh chân dung" style="display:none">
          <span id="avatarPlaceholder" class="help-text">Chưa có ảnh chân dung</span>
        </div>
      </section>

      <section class="card">
        <h3>Hồ sơ của bạn</h3>
        <div id="statusBox">Đang tải...</div>
      </section>
    </div>

    <section class="card">
      <h3>Nộp hồ sơ đăng ký xe máy</h3>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Số điện thoại liên hệ</label>
            <input type="tel" id="phone" placeholder="0912345678" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="congdan@gmail.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="loaiXe">Loại xe</label>
            <select id="loaiXe">
              <option>Xe mô tô 2 bánh</option>
              <option>Xe gắn máy điện</option>
            </select>
          </div>
          <div class="form-group">
            <label for="nhanHieu">Nhãn hiệu</label>
            <input type="text" id="nhanHieu" placeholder="Honda, Yamaha, VinFast..." required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dongXe">Dòng xe</label>
            <input type="text" id="dongXe" placeholder="Wave, Vision, SH..." required>
          </div>
          <div class="form-group">
            <label for="mauXe">Màu sơn</label>
            <input type="text" id="mauXe" placeholder="Trắng, Đỏ..." required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dungTich">Dung tích xi lanh / công suất</label>
            <input type="text" id="dungTich" placeholder="110 cc" required>
          </div>
          <div class="form-group">
            <label for="soKhung">Số khung (VIN)</label>
            <input type="text" id="soKhung" placeholder="17 ký tự" required>
          </div>
        </div>

        <div class="form-group">
          <label for="soMay">Số máy</label>
          <input type="text" id="soMay" placeholder="Số dập trên block động cơ" required>
        </div>

        <div class="form-group">
          <label for="fileInput">Ảnh cá nhân</label>
          <input type="file" id="fileInput" accept="image/*" required>
          <small class="help-text">Định dạng ảnh, dưới 2MB.</small>
        </div>

        <button type="submit" class="btn btn-primary">Gửi hồ sơ</button>
      </form>
    </section>
  </main>
    <dialog id="certDlg" class="cert-dlg">
    <div class="cert-bar no-print">
      <button class="btn btn-success" onclick="window.print()">In giấy đăng ký</button>
      <button class="btn btn-secondary" onclick="$('certDlg').close()">Đóng</button>
    </div>
    <div id="certBody"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
