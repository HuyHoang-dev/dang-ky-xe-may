<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Đăng ký xe máy trực tuyến</title>
  <link rel="icon" href="images/seal.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <section class="hero">
      <div class="hero-text">
        <div class="tag">Hệ thống dịch vụ công trực tuyến</div>
        <h1>Đăng ký và quản lý xe máy toàn quốc</h1>
        <p>Nộp hồ sơ đăng ký xe mô tô, xe gắn máy trực tuyến. Cán bộ Cảnh sát giao thông thẩm định hồ sơ và cấp biển số.</p>
      </div>
      <img src="banner.jpg" alt="Dịch vụ đăng ký xe máy trực tuyến">
    </section>

    <div class="login-grid">
      <div class="card">
        <h3>Đăng nhập hệ thống</h3>
        <div class="form-group">
          <label for="cmnd">Số CMND / Căn cước công dân</label>
          <input type="text" id="cmnd" placeholder="Nhập số CMND hoặc 'admin'" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
        </div>
        <p id="loginError" class="error-text" role="alert"></p>
        <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
      </div>

      <div class="card">
        <div class="quick-title">Tài khoản thử nghiệm</div>
        <p class="quick-note">Bấm vào một tài khoản để đăng nhập ngay.</p>
        <button class="quick-item" data-c="admin" data-p="admin123">
          <b>Cán bộ CSGT (vào index.html)</b>
          <span>CMND <code>admin</code> · Mật khẩu <code>admin123</code></span>
        </button>
        <button class="quick-item" data-c="001202001234" data-p="123456">
          <b>Nguyễn Văn An - công dân (vào user.html)</b>
          <span>CMND <code>001202001234</code> · Mật khẩu <code>123456</code></span>
        </button>
        <button class="quick-item" data-c="079201004567" data-p="123456">
          <b>Trần Thị Mai - hồ sơ đã duyệt</b>
          <span>CMND <code>079201004567</code> · Mật khẩu <code>123456</code></span>
        </button>
        <a href="#" class="reset-link" onclick="resetData(); return false;">Đặt lại dữ liệu mẫu</a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
